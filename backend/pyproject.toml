[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10,<4.0",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic[email]>=2.7,<3.0",
    "pyjwt>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "stripe>=11,<16",
    "uvicorn[standard]>=0.30,<1.0",
]


[tool.fastapi]
entrypoint = "app.main:app"
